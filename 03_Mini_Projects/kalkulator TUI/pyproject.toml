[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hitung-kalkulator"
dynamic = ["version"]
description = "HITUNG — kalkulator TUI untuk terminal, dibangun dengan Textual"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["kalkulator", "calculator", "tui", "textual", "terminal"]
dependencies = [
    "textual>=8.2,<9.0",
]

[project.urls]
Repository = "https://github.com/ujangboy/belajar-python/tree/main/03_Mini_Projects/kalkulator%20TUI"
Source = "https://github.com/ujangboy/belajar-python"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "textual-dev>=1.8",
]

[project.scripts]
# Setelah `pip install -e .`, aplikasi bisa dijalankan dari folder mana pun
# cukup dengan satu perintah:  hitung  atau  kalkulator
hitung = "hitung.app:main"
kalkulator = "hitung.app:main"

[tool.setuptools.dynamic]
version = { attr = "hitung.__version__" }

[tool.setuptools.packages.find]
include = ["hitung*"]

[tool.setuptools.package-data]
hitung = ["hitung.tcss"]
